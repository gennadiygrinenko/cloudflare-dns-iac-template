name: Security

# Misconfiguration scan for the Terraform module and the workflows.
#
# Deliberately not part of Validate: findings land in the Security tab as code
# scanning alerts instead of turning a pull request red. A scanner that blocks
# merges on advisory findings gets disabled within a week; one that files alerts
# stays useful. Tighten to a gate once the baseline is clean and understood.

on:
  pull_request:
    branches: [main]
    paths:
      - "terraform/**"
      - ".github/workflows/**"
  push:
    branches: [main]
    paths:
      - "terraform/**"
      - ".github/workflows/**"
  schedule:
    # Rules change even when the code does not. Monthly: this config is small
    # and rarely moves, so a weekly rerun is noise rather than coverage.
    - cron: "17 6 1 * *"

permissions:
  contents: read
  security-events: write

jobs:
  trivy-config:
    name: Trivy misconfiguration scan
    runs-on: ubuntu-24.04

    steps:
      - uses: actions/checkout@v7

      # Trivy alone, at the version mise.toml pins; the rest of the IaC
      # tooling is not needed for a config scan.
      - name: Install Trivy
        uses: jdx/mise-action@v2
        with:
          install_args: trivy
          cache: true

      # Advisory: alerts are the output, not a failed job (--exit-code 0).
      # Terragrunt writes .terragrunt-cache during plan; it is not source.
      - name: Scan Terraform and workflows
        run: |
          trivy config . \
            --format sarif --output trivy.sarif \
            --exit-code 0 \
            --skip-dirs '**/.terragrunt-cache'

      - name: Upload results to code scanning
        uses: github/codeql-action/upload-sarif@v4
        continue-on-error: true
        with:
          sarif_file: trivy.sarif
          category: trivy-config

      - name: Summarize
        run: |
          count=$(jq '[.runs[].results[]] | length' trivy.sarif 2>/dev/null || echo 0)
          echo "### Trivy misconfiguration scan" >> "$GITHUB_STEP_SUMMARY"
          if [ "$count" -eq 0 ]; then
            echo "No misconfigurations found." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "${count} finding(s) — see the Security tab (code scanning, category \`trivy-config\`)." >> "$GITHUB_STEP_SUMMARY"
          fi
