name: Deploy

on:
  push:
    branches: [main]
  # Manual run of the same plan → approval → apply, for a repository whose
  # pushes do not start workflows, or to re-deploy main without a new commit.
  workflow_dispatch:

permissions:
  contents: read


jobs:
  # ── Refuse to pretend: a fresh fork has no state bucket and no tokens ──────
  preflight:
    name: Preflight
    runs-on: ubuntu-24.04
    outputs:
      configured: ${{ steps.check.outputs.configured }}

    steps:
      - name: Check deployment credentials
        id: check
        env:
          R2_BUCKET: ${{ vars.R2_BUCKET }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          HAS_R2_KEY: ${{ secrets.R2_ACCESS_KEY_ID != '' }}
          HAS_R2_SECRET: ${{ secrets.R2_SECRET_ACCESS_KEY != '' }}
          HAS_CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN != '' }}
        run: |
          missing=""
          [ -n "$R2_BUCKET" ]             || missing="${missing} vars.R2_BUCKET"
          [ -n "$CLOUDFLARE_ACCOUNT_ID" ] || missing="${missing} vars.CLOUDFLARE_ACCOUNT_ID"
          [ "$HAS_R2_KEY" = "true" ]      || missing="${missing} secrets.R2_ACCESS_KEY_ID"
          [ "$HAS_R2_SECRET" = "true" ]   || missing="${missing} secrets.R2_SECRET_ACCESS_KEY"
          [ "$HAS_CF_TOKEN" = "true" ]    || missing="${missing} secrets.CLOUDFLARE_API_TOKEN"

          if [ -n "$missing" ]; then
            echo "configured=false" >> "$GITHUB_OUTPUT"
            {
              echo "### Deploy skipped — not configured"
              echo
              echo "Missing:"
              for item in $missing; do echo "- \`${item}\`"; done
              echo
              echo "This is expected in a fresh fork. See the README for setup;"
              echo "plan and apply stay skipped until all five are present."
            } >> "$GITHUB_STEP_SUMMARY"
          else
            echo "configured=true" >> "$GITHUB_OUTPUT"
            echo "### Deploy configured — planning all zones" >> "$GITHUB_STEP_SUMMARY"
          fi

  # ── Discover zones that have domains configured ───────────────────────────
  detect-zones:
    name: Detect zones
    needs: preflight
    if: needs.preflight.outputs.configured == 'true'
    runs-on: ubuntu-24.04
    outputs:
      zones: ${{ steps.detect.outputs.zones }}

    steps:
      - uses: actions/checkout@v7
      - name: List zones with domains
        id: detect
        run: bash .github/scripts/detect-zones.sh

  # ── Plan: parallel across all zones (max 5 concurrent) ───────────────────
  plan:
    name: Plan / ${{ matrix.zone }}
    needs: detect-zones
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      max-parallel: 5
      matrix:
        zone: ${{ fromJson(needs.detect-zones.outputs.zones) }}

    steps:
      - uses: actions/checkout@v7

      - name: Set up IaC tooling
        uses: ./.github/actions/setup-iac

      - name: Plan — ${{ matrix.zone }}
        id: plan
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET: ${{ vars.R2_BUCKET }}
        run: |
          mkdir -p "$TF_PLUGIN_CACHE_DIR"
          bash .github/scripts/plan-zone.sh "envs/cloudflare/zones/${{ matrix.zone }}"

      - name: Upload plan artifact
        uses: actions/upload-artifact@v7
        with:
          name: tfplan-${{ matrix.zone }}-${{ github.run_id }}
          path: |
            envs/cloudflare/zones/${{ matrix.zone }}/tfplan
            envs/cloudflare/zones/${{ matrix.zone }}/NO_CHANGES
          retention-days: 7
          if-no-files-found: error

  # ── Apply: sequential, manual approval via GitHub Environment ────────────
  apply:
    name: Apply / ${{ matrix.zone }}
    needs: [detect-zones, plan]
    runs-on: ubuntu-24.04
    environment: production # required reviewers configured in GitHub repo settings
    strategy:
      fail-fast: false
      max-parallel: 1 # apply zones one at a time
      matrix:
        zone: ${{ fromJson(needs.detect-zones.outputs.zones) }}
    # Prevent concurrent applies across workflow runs
    concurrency:
      group: terraform-apply-${{ matrix.zone }}
      cancel-in-progress: false

    steps:
      - uses: actions/checkout@v7

      - name: Set up IaC tooling
        uses: ./.github/actions/setup-iac

      # No continue-on-error: the plan job always uploads either a plan or a
      # NO_CHANGES marker, so a failed download is a real failure.
      - name: Download plan artifact
        uses: actions/download-artifact@v8
        with:
          name: tfplan-${{ matrix.zone }}-${{ github.run_id }}
          path: envs/cloudflare/zones/${{ matrix.zone }}/

      - name: Apply — ${{ matrix.zone }}
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET: ${{ vars.R2_BUCKET }}
        run: bash .github/scripts/apply-zone.sh "envs/cloudflare/zones/${{ matrix.zone }}"
