name: Validate

on:
  pull_request:
    branches: [main]
    paths:
      - "envs/cloudflare/zones/**"
      - "terraform/modules/**"
      - ".github/workflows/**"
      - ".github/scripts/**"

# Cancel in-progress runs for the same PR branch
concurrency:
  group: validate-${{ github.head_ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: write # for plan summary comment

env:
  TERRAFORM_VERSION: "1.9.8"
  TERRAGRUNT_VERSION: "0.67.0"
  TFLINT_VERSION: "v0.64.0"
  TF_PLUGIN_CACHE_DIR: ${{ github.workspace }}/.terraform-plugin-cache

jobs:
  # ── Detect which zones actually changed ──────────────────────────────────
  detect-zones:
    name: Detect changed zones
    runs-on: ubuntu-24.04
    outputs:
      zones: ${{ steps.detect.outputs.zones }}
      any_changes: ${{ steps.detect.outputs.any_changes }}

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Detect changed zones
        id: detect
        run: bash .github/scripts/detect-zones.sh "${{ github.event.pull_request.base.sha }}" "${{ github.sha }}"

  # ── Validate changed zones in parallel ───────────────────────────────────
  validate:
    name: Validate / ${{ matrix.zone }}
    needs: detect-zones
    if: needs.detect-zones.outputs.any_changes == 'true'
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        zone: ${{ fromJson(needs.detect-zones.outputs.zones) }}

    steps:
      - uses: actions/checkout@v4

      - name: Setup Terraform ${{ env.TERRAFORM_VERSION }}
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TERRAFORM_VERSION }}
          terraform_wrapper: false
          cli_config_credentials_token: ${{ secrets.TF_API_TOKEN }}

      - name: Install Terragrunt
        run: bash .github/scripts/install-terragrunt.sh "${{ env.TERRAGRUNT_VERSION }}"

      - name: Cache Terraform plugins
        uses: actions/cache@v4
        with:
          path: ${{ env.TF_PLUGIN_CACHE_DIR }}
          key: tf-plugins-${{ env.TERRAFORM_VERSION }}-${{ hashFiles('**/versions.tf', '**/versions.generated.tf') }}
          restore-keys: tf-plugins-${{ env.TERRAFORM_VERSION }}-

      - name: terraform fmt check
        run: terraform fmt -check -recursive terraform/

      - name: tflint
        uses: terraform-linters/setup-tflint@v4
        with:
          tflint_version: ${{ env.TFLINT_VERSION }}

      - name: Run tflint
        run: |
          tflint --init
          tflint --recursive --format compact

      - name: terragrunt validate — ${{ matrix.zone }}
        env:
          # Local backend: GitHub vars.TF_CLOUD_ORGANIZATION is often "" which
          # overrides Terragrunt's default and breaks `cloud {}` with hostname "".
          TG_BACKEND: local
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID || '0123456789abcdef0123456789abcdef' }}
        run: |
          source .github/scripts/common.sh
          log_section "Validate: ${{ matrix.zone }}"
          mkdir -p "$TF_PLUGIN_CACHE_DIR"
          ZONE_DIR="envs/cloudflare/zones/${{ matrix.zone }}"

          if ! grep -qE '^\s*"[^"]+"\s*=' "${ZONE_DIR}/variables.auto.tfvars" 2>/dev/null; then
            log_info "No domains configured in ${{ matrix.zone }} — skipping."
            exit 0
          fi

          cd "$ZONE_DIR"
          terragrunt validate --terragrunt-non-interactive 2>&1 | tee /tmp/validate.log
          EXIT_CODE=${PIPESTATUS[0]}

          echo "### Validation: ${{ matrix.zone }}" >> "$GITHUB_STEP_SUMMARY"
          if [ "$EXIT_CODE" -eq 0 ]; then
            log_success "Validation passed: ${{ matrix.zone }}"
            echo "✅ Passed" >> "$GITHUB_STEP_SUMMARY"
          else
            log_error "Validation failed: ${{ matrix.zone }}"
            echo "❌ Failed" >> "$GITHUB_STEP_SUMMARY"
            echo '```' >> "$GITHUB_STEP_SUMMARY"
            cat /tmp/validate.log >> "$GITHUB_STEP_SUMMARY"
            echo '```' >> "$GITHUB_STEP_SUMMARY"
          fi

          exit "$EXIT_CODE"

  # ── DMARC report authorizations we cannot publish ourselves ──────────────
  # A rua mailbox in an unmanaged zone needs a record there, or reports are
  # silently dropped. Advisory only: never fails the PR, and skipped for forks,
  # which have no secrets and would otherwise get a red badge.
  dmarc-checklist:
    name: DMARC report checklist
    needs: [detect-zones, validate]
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    continue-on-error: true

    steps:
      - uses: actions/checkout@v4

      - name: Setup Terraform ${{ env.TERRAFORM_VERSION }}
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TERRAFORM_VERSION }}
          terraform_wrapper: false

      - name: Install Terragrunt
        run: bash .github/scripts/install-terragrunt.sh "${{ env.TERRAGRUNT_VERSION }}"

      - name: Collect checklist
        id: collect
        env:
          ZONES: ${{ needs.detect-zones.outputs.zones }}
          TG_BACKEND: local
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID || '0123456789abcdef0123456789abcdef' }}
        run: bash .github/scripts/dmarc-checklist.sh

      - name: Comment on PR
        if: steps.collect.outputs.has_findings == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR: ${{ github.event.pull_request.number }}
        run: |
          gh pr comment "$PR" --body-file /tmp/dmarc-checklist.md --edit-last \
            || gh pr comment "$PR" --body-file /tmp/dmarc-checklist.md

  # ── Summary gate — single status check for branch protection ─────────────
  validate-complete:
    name: Validate complete
    needs: [detect-zones, validate]
    if: always()
    runs-on: ubuntu-24.04
    steps:
      - name: Check results
        run: |
          detect="${{ needs.detect-zones.result }}"
          validate="${{ needs.validate.result }}"
          any_changes="${{ needs.detect-zones.outputs.any_changes }}"

          if [ "$detect" != "success" ]; then
            echo "Detect zones failed (result: $detect)."
            exit 1
          fi
          if [ "$any_changes" = "true" ] && [ "$validate" != "success" ]; then
            echo "One or more zones failed validation (result: $validate)."
            exit 1
          fi
          echo "All zones validated successfully."
