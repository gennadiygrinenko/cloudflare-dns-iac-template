name: Validate

on:
  # No path filter. It used to list the Terraform paths, which meant a pull
  # request touching only a template, the README or dependabot.yml ran no
  # checks at all -- and those are precisely the files the hygiene hooks
  # below guard. The heavy work is still skipped internally: zone validation
  # runs only for zones that changed.
  pull_request:
    branches: [main]

# Cancel in-progress runs for the same PR branch
concurrency:
  group: validate-${{ github.head_ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: write # for plan summary comment

env:
  TERRAFORM_VERSION: "1.16.0"
  TERRAGRUNT_VERSION: "1.1.4"
  TFLINT_VERSION: "v0.64.0"
  PRE_COMMIT_VERSION: "4.6.2"
  TF_PLUGIN_CACHE_DIR: ${{ github.workspace }}/.terraform-plugin-cache

jobs:
  # ── Tool version pins ────────────────────────────────────────────────────
  # The pins below are plain env strings repeated across four workflows, which
  # Dependabot cannot see and no job notices when a bump misses one of them.
  version-pins:
    name: Version pins
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      - name: Check version pins agree
        run: bash .github/scripts/check-version-pins.sh

  # ── File hygiene ─────────────────────────────────────────────────────────
  # The pre-commit hooks were local-only: `make hooks` has to be run by hand,
  # so anyone who never ran it bypassed all of them, and a trailing space sat
  # in two templates until someone happened to look. The Terraform and
  # Terragrunt hooks are skipped here because fmt, tflint and validate already
  # run as their own steps below, with a plugin cache. What is left is the half
  # nothing else checked at all -- including private keys and oversized files.
  hygiene:
    name: File hygiene
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Cache hook environments
        uses: actions/cache@v6
        with:
          path: ~/.cache/pre-commit
          key: pre-commit-${{ env.PRE_COMMIT_VERSION }}-${{ hashFiles('.pre-commit-config.yaml') }}

      - name: Install pre-commit ${{ env.PRE_COMMIT_VERSION }}
        run: pip install "pre-commit==${{ env.PRE_COMMIT_VERSION }}"

      - name: Run hygiene hooks
        env:
          SKIP: terraform_fmt,terraform_validate,terraform_tflint,terragrunt_fmt,terragrunt_validate
        run: pre-commit run --all-files --show-diff-on-failure

  # ── Script decision logic ────────────────────────────────────────────────
  # The faults these scripts shipped were shell logic, not Terraform: a
  # discarded exit code, a missing artifact read as an empty plan, a relative
  # path that broke a move halfway through, a grep that matched zones but not
  # records. None of them needs a Cloudflare account to reproduce, and none was
  # reachable by a test while the logic lived inside a workflow file.
  script-logic:
    name: Script logic
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      - name: Test plan and apply decisions
        run: bash .github/scripts/tests/deploy-logic.sh

      - name: Test state operation routing
        run: bash .github/scripts/tests/state-ops-logic.sh

  # ── Detect which zones actually changed ──────────────────────────────────
  detect-zones:
    name: Detect changed zones
    runs-on: ubuntu-24.04
    outputs:
      zones: ${{ steps.detect.outputs.zones }}
      any_changes: ${{ steps.detect.outputs.any_changes }}

    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Detect changed zones
        id: detect
        run: bash .github/scripts/detect-zones.sh "${{ github.event.pull_request.base.sha }}" "${{ github.sha }}"

  # ── Module logic tests ───────────────────────────────────────────────────
  # Plan-only runs against fixture inputs: no credentials, no API calls, and
  # independent of which zones changed. terragrunt validate checks that the
  # config parses; this checks that it means what the README says it means.
  test:
    name: Module tests
    runs-on: ubuntu-24.04

    steps:
      - uses: actions/checkout@v7

      - name: Setup Terraform ${{ env.TERRAFORM_VERSION }}
        uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: ${{ env.TERRAFORM_VERSION }}
          terraform_wrapper: false

      - name: Cache Terraform plugins
        uses: actions/cache@v6
        with:
          path: ${{ env.TF_PLUGIN_CACHE_DIR }}
          key: tf-plugins-${{ env.TERRAFORM_VERSION }}-${{ hashFiles('**/versions.tf') }}
          restore-keys: tf-plugins-${{ env.TERRAFORM_VERSION }}-

      - name: terraform test
        run: |
          mkdir -p "$TF_PLUGIN_CACHE_DIR"
          terraform -chdir=terraform/modules/dns-zone init -backend=false -input=false
          terraform -chdir=terraform/modules/dns-zone test

  # ── Validate changed zones in parallel ───────────────────────────────────
  validate:
    name: Validate / ${{ matrix.zone }}
    needs: detect-zones
    if: needs.detect-zones.outputs.any_changes == 'true'
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        zone: ${{ fromJson(needs.detect-zones.outputs.zones) }}

    steps:
      - uses: actions/checkout@v7

      - name: Setup Terraform ${{ env.TERRAFORM_VERSION }}
        uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: ${{ env.TERRAFORM_VERSION }}
          terraform_wrapper: false
          cli_config_credentials_token: ${{ secrets.TF_API_TOKEN }}

      - name: Install Terragrunt
        run: bash .github/scripts/install-terragrunt.sh "${{ env.TERRAGRUNT_VERSION }}"

      - name: Cache Terraform plugins
        uses: actions/cache@v6
        with:
          path: ${{ env.TF_PLUGIN_CACHE_DIR }}
          key: tf-plugins-${{ env.TERRAFORM_VERSION }}-${{ hashFiles('**/versions.tf', '**/versions.generated.tf') }}
          restore-keys: tf-plugins-${{ env.TERRAFORM_VERSION }}-

      - name: terraform fmt check
        run: terraform fmt -check -recursive terraform/

      - name: tflint
        uses: terraform-linters/setup-tflint@v6
        with:
          tflint_version: ${{ env.TFLINT_VERSION }}

      - name: Run tflint
        run: |
          tflint --init
          tflint --recursive --format compact

      - name: terragrunt validate — ${{ matrix.zone }}
        env:
          # Local backend: GitHub vars.TF_CLOUD_ORGANIZATION is often "" which
          # overrides Terragrunt's default and breaks `cloud {}` with hostname "".
          TG_BACKEND: local
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID || '0123456789abcdef0123456789abcdef' }}
        run: |
          source .github/scripts/common.sh
          log_section "Validate: ${{ matrix.zone }}"
          mkdir -p "$TF_PLUGIN_CACHE_DIR"
          ZONE_DIR="envs/cloudflare/zones/${{ matrix.zone }}"

          if ! grep -qE '^\s*"[^"]+"\s*=' "${ZONE_DIR}/variables.auto.tfvars" 2>/dev/null; then
            log_info "No domains configured in ${{ matrix.zone }} — skipping."
            exit 0
          fi

          cd "$ZONE_DIR"
          terragrunt validate --non-interactive 2>&1 | tee /tmp/validate.log
          EXIT_CODE=${PIPESTATUS[0]}

          echo "### Validation: ${{ matrix.zone }}" >> "$GITHUB_STEP_SUMMARY"
          if [ "$EXIT_CODE" -eq 0 ]; then
            log_success "Validation passed: ${{ matrix.zone }}"
            echo "✅ Passed" >> "$GITHUB_STEP_SUMMARY"
          else
            log_error "Validation failed: ${{ matrix.zone }}"
            echo "❌ Failed" >> "$GITHUB_STEP_SUMMARY"
            echo '```' >> "$GITHUB_STEP_SUMMARY"
            cat /tmp/validate.log >> "$GITHUB_STEP_SUMMARY"
            echo '```' >> "$GITHUB_STEP_SUMMARY"
          fi

          exit "$EXIT_CODE"

  # ── DMARC report authorizations we cannot publish ourselves ──────────────
  # A rua mailbox in an unmanaged zone needs a record there, or reports are
  # silently dropped. Advisory only: never fails the PR, and skipped for forks,
  # which have no secrets and would otherwise get a red badge.
  dmarc-checklist:
    name: DMARC report checklist
    needs: [detect-zones, validate]
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    continue-on-error: true

    steps:
      - uses: actions/checkout@v7

      - name: Setup Terraform ${{ env.TERRAFORM_VERSION }}
        uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: ${{ env.TERRAFORM_VERSION }}
          terraform_wrapper: false

      - name: Install Terragrunt
        run: bash .github/scripts/install-terragrunt.sh "${{ env.TERRAGRUNT_VERSION }}"

      - name: Collect checklist
        id: collect
        env:
          ZONES: ${{ needs.detect-zones.outputs.zones }}
          TG_BACKEND: local
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID || '0123456789abcdef0123456789abcdef' }}
        run: bash .github/scripts/dmarc-checklist.sh

      - name: Comment on PR
        if: steps.collect.outputs.has_findings == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR: ${{ github.event.pull_request.number }}
        run: |
          gh pr comment "$PR" --body-file /tmp/dmarc-checklist.md --edit-last \
            || gh pr comment "$PR" --body-file /tmp/dmarc-checklist.md

  # ── Summary gate — single status check for branch protection ─────────────
  validate-complete:
    name: Validate complete
    needs: [version-pins, hygiene, script-logic, detect-zones, test, validate]
    if: always()
    runs-on: ubuntu-24.04
    steps:
      - name: Check results
        run: |
          pins="${{ needs.version-pins.result }}"
          hygiene="${{ needs.hygiene.result }}"
          script_logic="${{ needs.script-logic.result }}"
          detect="${{ needs.detect-zones.result }}"
          tests="${{ needs.test.result }}"
          validate="${{ needs.validate.result }}"
          any_changes="${{ needs.detect-zones.outputs.any_changes }}"

          if [ "$pins" != "success" ]; then
            echo "Version pins disagree between workflows (result: $pins)."
            exit 1
          fi
          if [ "$hygiene" != "success" ]; then
            echo "File hygiene hooks failed (result: $hygiene)."
            exit 1
          fi
          if [ "$script_logic" != "success" ]; then
            echo "Script decision logic tests failed (result: $script_logic)."
            exit 1
          fi
          if [ "$detect" != "success" ]; then
            echo "Detect zones failed (result: $detect)."
            exit 1
          fi
          if [ "$tests" != "success" ]; then
            echo "Module tests failed (result: $tests)."
            exit 1
          fi
          if [ "$any_changes" = "true" ] && [ "$validate" != "success" ]; then
            echo "One or more zones failed validation (result: $validate)."
            exit 1
          fi
          echo "All zones validated successfully."
