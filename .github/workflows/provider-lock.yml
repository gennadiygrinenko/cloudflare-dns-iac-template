name: Provider lock

# Move the committed zone locks to the newest provider allowed by the
# constraint, and open a pull request when that changes anything.
#
# Dependabot covers the constraint in versions.tf (it will propose ~> 6.0 when
# that exists); this covers the exact build inside the constraint, which
# Dependabot never touches because no manifest changes.

on:
  schedule:
    # Monthly. A provider patch a week earlier changes nothing here; action
    # deprecations are the time-sensitive half, and Dependabot covers those
    # weekly.
    - cron: "23 6 1 * *"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

env:
  TERRAFORM_VERSION: "1.15.8"
  TERRAGRUNT_VERSION: "1.1.4"
  BRANCH: chore/refresh-provider-lock

jobs:
  refresh:
    name: Refresh provider lock
    runs-on: ubuntu-24.04

    steps:
      - uses: actions/checkout@v7

      - name: Setup Terraform ${{ env.TERRAFORM_VERSION }}
        uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: ${{ env.TERRAFORM_VERSION }}
          terraform_wrapper: false

      - name: Install Terragrunt
        run: bash .github/scripts/install-terragrunt.sh "${{ env.TERRAGRUNT_VERSION }}"

      - name: Refresh locks
        id: refresh
        run: bash .github/scripts/refresh-locks.sh

      # A lock PR that nobody validates is how a bad provider reaches main.
      # Pull requests opened with GITHUB_TOKEN do not start workflows, so the
      # zones are validated here instead.
      - name: Validate zones with the new lock
        if: steps.refresh.outputs.changed == 'true'
        env:
          TG_BACKEND: local
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID || '0123456789abcdef0123456789abcdef' }}
        run: |
          set -o pipefail
          source .github/scripts/common.sh
          for dir in envs/cloudflare/zones/*/; do
            grep -qE '^\s*"[^"]+"\s*=' "${dir}variables.auto.tfvars" 2>/dev/null || continue
            log_section "Validate: $(basename "$dir")"
            (cd "$dir" && terragrunt validate --non-interactive)
          done

      - name: Open pull request
        if: steps.refresh.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SUMMARY: ${{ steps.refresh.outputs.summary }}
        run: |
          git -c user.name='github-actions[bot]' \
              -c user.email='41898282+github-actions[bot]@users.noreply.github.com' \
              checkout -B "$BRANCH"
          git add envs/cloudflare/zones/*/.terraform.lock.hcl
          git -c user.name='github-actions[bot]' \
              -c user.email='41898282+github-actions[bot]@users.noreply.github.com' \
              commit -m "chore: move zone provider locks to the newest allowed release"
          # A bare --force-with-lease reads the remote-tracking ref through the
          # configured refspec, and checkout only configures main -- so it finds
          # no lease base and rejects with "stale info" once the branch exists.
          # Fetch the branch and name the base explicitly instead. An empty base
          # means "must not exist yet", which is the first run.
          git fetch origin "+refs/heads/$BRANCH:refs/remotes/origin/$BRANCH" || true
          lease=$(git rev-parse --verify --quiet "refs/remotes/origin/$BRANCH" || true)
          git push --force-with-lease="$BRANCH:$lease" origin "$BRANCH"

          body=$(printf '## Provider lock refresh\n\n%s\nThe `~> 5.0` constraint is unchanged — only the locked build moved. Zones were validated in the workflow run, since pull requests opened by Actions do not trigger checks.\n' "$SUMMARY")
          # Ask whether the pull request exists rather than letting a failed
          # create fall through to edit: that swallowed the real error and
          # reported "no pull requests found" for every kind of failure.
          if [ -n "$(gh pr list --head "$BRANCH" --base main --state open --json number --jq '.[].number')" ]; then
            gh pr edit "$BRANCH" --body "$body"
          else
            gh pr create --base main --head "$BRANCH" \
              --title "chore: refresh Cloudflare provider lock" \
              --body "$body"
          fi
