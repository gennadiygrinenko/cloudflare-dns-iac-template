name: Set up IaC tooling
description: >
  Install the tools pinned in mise.toml — Terraform, Terragrunt, tflint,
  pre-commit and the rest — and restore the provider plugin cache. Versions are
  declared in that one file and nowhere else, so a laptop and every workflow
  run the same builds.

inputs:
  cache-key-files:
    description: Glob whose hash keys the plugin cache.
    required: false
    default: "**/versions.tf"

runs:
  using: composite
  steps:
    - name: Install the tools pinned in mise.toml
      uses: jdx/mise-action@v2
      with:
        install: true
        cache: true

    # Exported so later steps in the calling job can still mkdir it, as they
    # did when every workflow declared it for itself.
    - name: Export the plugin cache directory
      shell: bash
      run: echo "TF_PLUGIN_CACHE_DIR=${GITHUB_WORKSPACE}/.terraform-plugin-cache" >>"$GITHUB_ENV"

    - name: Cache Terraform plugins
      uses: actions/cache@v6
      with:
        path: ${{ github.workspace }}/.terraform-plugin-cache
        key: tf-plugins-${{ hashFiles('mise.toml') }}-${{ hashFiles(inputs.cache-key-files) }}
        restore-keys: tf-plugins-${{ hashFiles('mise.toml') }}-
