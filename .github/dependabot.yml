version: 2

updates:
  # Action versions are pinned in the workflows; without this they rot silently
  # until a runner drops the Node version they target.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: "chore(ci)"
    labels:
      - dependencies
      - ci

  # Cloudflare provider constraint in the module.
  - package-ecosystem: terraform
    directory: /terraform/modules/dns-zone
    schedule:
      interval: weekly
    commit-message:
      prefix: "chore(deps)"
    labels:
      - dependencies
      - terraform
