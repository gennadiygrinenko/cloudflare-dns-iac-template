# Tool versions, declared once. `mise install` gives a laptop exactly what CI
# runs; the setup-iac action installs from this file on every job. Nothing
# else in the repository may pin these tools — the Version pins check fails a
# workflow that tries. The Tool versions workflow moves them to newer releases
# monthly and opens a pull request, since no Dependabot ecosystem reads this
# file.
[tools]
# Not 1.16.0: it honours only the first of several import blocks aimed at one
# for_each resource and plans the rest as create, silently. Found on the first
# real zone adoption; .github/scripts/tests/terraform-import-blocks.sh proves
# it and gates every version the Tool versions workflow proposes.
terraform  = "1.16.5"
terragrunt = "1.1.6"
tflint     = "0.64.0"
pre-commit = "4.6.2"
shellcheck = "0.11.0"
jq         = "1.8.2"
gitleaks   = "8.30.1"
# Only the Security workflow scans with it. Pinned here, not in that workflow,
# because GITHUB_TOKEN may not push edits to .github/workflows/ — the Tool
# versions refresh failed on exactly that while Trivy lived in a workflow env.
trivy      = "0.75.0"

[env]
# Terragrunt prefers OpenTofu when both are on PATH. A laptop with tofu from
# Homebrew then plans with a different binary than CI, which has none -- and
# the Terraform pin above, with the import-block test behind it, means nothing
# there. Name the binary so mise's terraform is the one used everywhere.
TG_TF_PATH = "terraform"
