repos:
  # Terraform formatting and validation
  - repo: https://github.com/antonbabenko/pre-commit-terraform
    rev: v1.109.0
    hooks:
      - id: terraform_fmt
      - id: terraform_validate
        args:
          - --hook-config=--retry-once-with-cleanup=true
      - id: terraform_tflint
        args:
          - --args=--config=__GIT_WORKING_DIR__/.tflint.hcl
      - id: terragrunt_fmt
      - id: terragrunt_validate

  # General file hygiene
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-merge-conflict
      - id: detect-private-key
      - id: check-added-large-files
        args: ["--maxkb=500"]

  # Shell scripts
  - repo: https://github.com/shellcheck-py/shellcheck-py
    rev: v0.11.0.1
    hooks:
      - id: shellcheck
        args: [--severity=warning]

  # Secret scanner. The public repository plus GitHub Secrets is a safe pair
  # only while no secret is ever committed; detect-private-key above does not
  # know an API token from a string. gitleaks comes from mise.toml, and scans
  # the whole tree so the hygiene job's --all-files run covers history's
  # blind spots too, not only the staged diff.
  - repo: local
    hooks:
      - id: gitleaks
        name: gitleaks (no secrets in the tree)
        entry: gitleaks dir . --redact --no-banner --exit-code 1
        language: system
        pass_filenames: false
        always_run: true
